name: Linux

on:
  push:
    branches: [ "main", "release-**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build jar
        run: mvn -B package

      - name: Package into app-image
        shell: bash
        run: |
          rm -rf build/ChromaForge-Launcher
          MAIN_JAR=$(basename "$(ls target/*.jar | head -n1)")
          jpackage --input target/ --name ChromaForge-Launcher --main-jar "$MAIN_JAR" --main-class chromaforge.launcher.Launcher --type app-image --dest build/ --icon dev/icon.png --java-options '-Dfile.encoding=UTF-8'

      - name: Upload app-image
        uses: actions/upload-artifact@v4
        with:
          name: ChromaForge-Launcher-linux
          path: build/ChromaForge-Launcher
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ChromaForge-Launcher-linux
          path: ChromaForge-Launcher

      - name: Make launcher executable
        # upload/download-artifact round-trip strips exec bits
        # (bin/ChromaForge-Launcher and the bundled runtime/bin/java), restore them
        run: chmod -R +x ChromaForge-Launcher

      - name: Install engine run deps
        run: sudo apt-get update && sudo apt-get install -y libfuse2 libgl1 libglx-mesa0 libopengl0 libegl1 libgbm1

      - run: ./ChromaForge-Launcher/bin/ChromaForge-Launcher version
      - run: ./ChromaForge-Launcher/bin/ChromaForge-Launcher fetch
      - run: ./ChromaForge-Launcher/bin/ChromaForge-Launcher install 0.4.1
      - run: ./ChromaForge-Launcher/bin/ChromaForge-Launcher new test 0.4.1
      - run: ./ChromaForge-Launcher/bin/ChromaForge-Launcher check 0.4.1
      - run: ./ChromaForge-Launcher/bin/ChromaForge-Launcher launch test -- --headless