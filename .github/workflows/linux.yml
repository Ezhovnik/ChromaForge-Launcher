name: Linux

on:
  push:
    branches: [ "main", "release-**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build jar
        run: mvn -B package

      - name: Package into app-image
        shell: bash
        run: |
          rm -rf build/launcher
          MAIN_JAR=$(basename "$(ls target/*.jar | head -n1)")
          jpackage --input target/ --name launcher --main-jar "$MAIN_JAR" --main-class chromaforge.launcher.Launcher --type app-image --dest build/ --java-options '-Dfile.encoding=UTF-8'

      - name: Upload app-image
        uses: actions/upload-artifact@v4
        with:
          name: launcher-linux
          path: build/launcher
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: launcher-linux
          path: launcher

      - name: Install engine run deps
        run: sudo apt-get update && sudo apt-get install -y libfuse2 libgl1 libglx-mesa0 libopengl0 libegl1 libgbm1

      - run: ./launcher/bin/launcher version
      - run: ./launcher/bin/launcher fetch
      - run: ./launcher/bin/launcher install 0.4.1
      - run: ./launcher/bin/launcher new test 0.4.1
      - run: ./launcher/bin/launcher check 0.4.1
      - run: ./launcher/bin/launcher launch test -- --headless