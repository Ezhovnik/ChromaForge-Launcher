name: Windows

on:
  push:
    branches: [ "main", "release-**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build jar
        run: mvn -B package

      - name: Package into exe (app-image)
        shell: pwsh
        run: |
          if (Test-Path build\ChromaForge-Launcher) { Remove-Item -Recurse -Force build\ChromaForge-Launcher }
          $mainJar = (Get-ChildItem target -Filter *.jar | Select-Object -First 1).Name
          jpackage --input target/ --name ChromaForge-Launcher --main-jar $mainJar --main-class chromaforge.launcher.Launcher --type app-image --dest build/ --icon dev/icon.ico --java-options '-Dfile.encoding=UTF-8' --win-console

      - name: Upload app-image
        uses: actions/upload-artifact@v4
        with:
          name: ChromaForge-Launcher-windows
          path: build/ChromaForge-Launcher
          if-no-files-found: error

  test:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ChromaForge-Launcher-windows
          path: ChromaForge-Launcher

      - run: .\ChromaForge-Launcher\ChromaForge-Launcher.exe version
      - run: .\ChromaForge-Launcher\ChromaForge-Launcher.exe fetch
      - run: .\ChromaForge-Launcher\ChromaForge-Launcher.exe install 0.4.1
      - run: .\ChromaForge-Launcher\ChromaForge-Launcher.exe new test 0.4.1
      - run: .\ChromaForge-Launcher\ChromaForge-Launcher.exe check 0.4.1
      - run: .\ChromaForge-Launcher\ChromaForge-Launcher.exe launch test -- --headless