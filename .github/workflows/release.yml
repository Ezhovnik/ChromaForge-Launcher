name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Launcher release version, e.g. 1.0.0 (optional leading "v" is stripped)'
        required: true
        default: '0.0.0'

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          v="$(printf '%s' "$RAW_VERSION" | tr -d '[:space:]')"
          v="${v#v}"
          v="${v#V}"
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version input '$RAW_VERSION'. Expected MAJOR.MINOR.PATCH, e.g. 1.0.0"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build jar
        run: mvn -B package "-Drevision=$VERSION"

      - name: Verify jar version
        shell: bash
        run: |
          JAR=$(ls target/ChromaForge-Launcher-*.jar | head -n1)
          OUT=$(java -jar "$JAR" version)
          echo "$OUT"
          echo "$OUT" | grep -qF "v${VERSION}" || { echo "Version mismatch: expected v${VERSION}"; exit 1; }

      - name: Package into app-image
        shell: bash
        run: |
          rm -rf build/ChromaForge-Launcher
          MAIN_JAR=$(basename "$(ls target/*.jar | head -n1)")
          if [ "$RUNNER_OS" = "Linux" ]; then
            jpackage --input target/ --name ChromaForge-Launcher --main-jar "$MAIN_JAR" --main-class chromaforge.launcher.Launcher --type app-image --dest build/ --icon dev/icon.png --java-options '-Dfile.encoding=UTF-8'
          else
            jpackage --input target/ --name ChromaForge-Launcher --main-jar "$MAIN_JAR" --main-class chromaforge.launcher.Launcher --type app-image --dest build/ --icon dev/icon.ico --java-options '-Dfile.encoding=UTF-8' --win-console
          fi

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -czf "ChromaForge-Launcher-linux-${VERSION}.tar.gz" -C build ChromaForge-Launcher
          cp target/ChromaForge-Launcher-*.jar "ChromaForge-Launcher-${VERSION}.jar"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build\ChromaForge-Launcher -DestinationPath "ChromaForge-Launcher-windows-$env:VERSION.zip" -Force

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: ChromaForge-Launcher-${{ runner.os }}
          path: |
            ChromaForge-Launcher-*.tar.gz
            ChromaForge-Launcher-*.zip
            ChromaForge-Launcher-*.jar
          if-no-files-found: error

      - name: Upload app-image
        uses: actions/upload-artifact@v4
        with:
          name: app-image-${{ runner.os }}
          path: build/ChromaForge-Launcher
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-image-${{ runner.os }}
          path: app-image

      - name: Install engine run deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 libgl1 libglx-mesa0 libopengl0 libegl1 libgbm1

      - name: Test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod -R +x app-image
          APP=app-image/bin/ChromaForge-Launcher
          "$APP" version
          "$APP" fetch
          "$APP" install 0.4.1
          "$APP" new test 0.4.1
          "$APP" check 0.4.1
          "$APP" launch test -- --headless

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem app-image -Force | Select-Object Name, Length
          $APP = (Resolve-Path 'app-image\ChromaForge-Launcher.exe').Path
          & $APP version
          & $APP fetch
          & $APP install 0.4.1
          & $APP new test 0.4.1
          & $APP check 0.4.1
          & $APP launch test -- --headless

  release:
    name: Publish release
    needs: [ version, build, test ]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ChromaForge-Launcher-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" artifacts/* \
              --title "$TAG" \
              --generate-notes \
              --draft
          else
            gh release upload "$TAG" artifacts/* --clobber
          fi
