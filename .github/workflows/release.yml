name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Launcher release version'
        required: true
        default: '0.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build jar
        run: mvn -B package

      - name: Package into app-image
        shell: bash
        run: |
          rm -rf build/launcher
          MAIN_JAR=$(basename "$(ls target/*.jar | head -n1)")
          if [ "$RUNNER_OS" = "Linux" ]; then
            jpackage --input target/ --name launcher --main-jar "$MAIN_JAR" --main-class chromaforge.launcher.Launcher --type app-image --dest build/ --java-options '-Dfile.encoding=UTF-8'
          else
            jpackage --input target/ --name launcher --main-jar "$MAIN_JAR" --main-class chromaforge.launcher.Launcher --type app-image --dest build/ --java-options '-Dfile.encoding=UTF-8' --win-console
          fi

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -czf "launcher-linux-${VERSION}.tar.gz" -C build launcher
          cp target/launcher-*.jar "launcher-${VERSION}.jar"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build\launcher -DestinationPath "launcher-windows-$env:VERSION.zip" -Force

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ runner.os }}
          path: |
            launcher-*.tar.gz
            launcher-*.zip
            launcher-*.jar
          if-no-files-found: error

      - name: Upload app-image
        uses: actions/upload-artifact@v4
        with:
          name: app-image-${{ runner.os }}
          path: build/launcher
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-image-${{ runner.os }}
          path: app-image

      - name: Install engine run deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 libgl1 libglx-mesa0 libopengl0 libegl1 libgbm1

      - name: Test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod -R +x app-image
          APP=app-image/bin/launcher
          "$APP" version
          "$APP" fetch
          "$APP" install 0.4.1
          "$APP" new test 0.4.1
          "$APP" check 0.4.1
          "$APP" launch test -- --headless

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem app-image -Force | Select-Object Name, Length
          $APP = (Resolve-Path 'app-image\launcher.exe').Path
          & $APP version
          & $APP fetch
          & $APP install 0.4.1
          & $APP new test 0.4.1
          & $APP check 0.4.1
          & $APP launch test -- --headless

  release:
    name: Publish release
    needs: [ build, test ]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" artifacts/* \
              --title "$TAG" \
              --generate-notes \
              --draft
          else
            gh release upload "$TAG" artifacts/* --clobber
          fi
